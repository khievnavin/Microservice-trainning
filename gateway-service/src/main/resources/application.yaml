server:
  port: 8585
  foward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order-service/**
              filters:
                - RewritePath=/order-service/(?<segment>.*), /$\{segment}
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          trusted-proxies: ".*"
    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848

management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway"
  endpoint:
    gateway:
      access: read_only
springdoc:
  swagger-ui:
    urls:
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
      - name: Business Service
        url: /business-service/v3/api-docs