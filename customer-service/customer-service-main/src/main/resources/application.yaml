feign:
  sentinel:
    enabled: true

server:
  port: 8584
  forward-headers-strategy: framework

spring:
  application:
    name: customer-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name} # Nacos Data ID, e.g. order-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: nacos
      server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: localhost:8081
        port: 8722
        client-ip: 127.0.0.1
      eager: true
      web-context-unify: false

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_usr
    password: qwerqwer
    url: jdbc:postgresql://localhost:8432/db_customer
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

